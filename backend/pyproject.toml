[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-renamer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pypdf>=6.18.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
invoice-renamer-worker = "invoice_renamer.api.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_renamer"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.16.7",
]
