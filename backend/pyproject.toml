[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-renamer"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "huggingface_hub>=1.31.0",
    "llama-cpp-python>=0.3.35",
    "ocrmac>=1.0.1; sys_platform == 'darwin'",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pycountry>=26.2.16",
    "pypdf>=6.18.1",
    "pypdfium2>=5.13.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.20",
    "torch>=2.9.1",
    "transformers>=5.17.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
invoice-renamer-worker = "invoice_renamer.api.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_renamer"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pytesseract", "pypdfium2", "ocrmac", "ocrmac.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Linux dev/CI has no GPU, so torch is pinned to the CPU-only wheel there to
# avoid pulling multi-GB CUDA libraries it can't use. macOS has no CUDA variant
# at all - its default PyPI wheel is already the lean MPS-capable build - so it
# falls through to the normal index instead of this pin (the pinned index's
# macOS wheel for 2.9.1 turned out to be missing torchgen, which torch's own
# import path needs; the default PyPI wheel doesn't have that problem).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.16.7",
    "types-psutil>=7.2.2.20260906",
]
