[package]
name = "invoice-renamer"
version = "0.1.0"
license = "MIT"
description = "Invoice Renamer desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "invoice_renamer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "invoice-renamer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
log = "0.4.34"
open = "5"
rand = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1.53.1", features = ["time", "rt", "sync", "macros", "process", "io-util"] }
