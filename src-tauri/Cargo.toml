[package]
name = "invoice-renamer"
version = "0.1.0"
description = "Invoice Renamer desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "invoice_renamer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "invoice-renamer"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
log = "0.4.34"
rand = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = "2"
tauri-plugin-shell = "2"
tokio = { version = "1.53.1", features = ["time", "rt", "sync", "macros"] }
